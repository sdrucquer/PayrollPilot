[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "payrollpilot"
version = "0.1.0"
description = "PayrollPilot backend: FastAPI + SQLite coordinator for payroll preparation (hackathon 2026-10-20)"
requires-python = ">=3.13"
dependencies = [
  "payrollpilot-core",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "openpyxl>=3.1",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["payrollpilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
payrollpilot-core = { path = "../core" }
