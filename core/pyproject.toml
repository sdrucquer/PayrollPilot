[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "payrollpilot-core"
version = "0.1.0"
description = "PayrollPilot pure core: audit rules, payroll calculation, readiness, workbook (no IO, no LLM)"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["payrollpilot_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
